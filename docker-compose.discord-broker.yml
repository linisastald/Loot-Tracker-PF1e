version: '3.8'

services:
  discord-broker:
    image: discord-broker:dev
    container_name: discord-broker
    restart: unless-stopped

    environment:
      # Discord application public key (REQUIRED): verifies the signature on every interaction
      - DISCORD_PUBLIC_KEY=${DISCORD_PUBLIC_KEY}

      # Broker Service Configuration (the only settings discord-handler/server.js reads)
      - PORT=3000
      - NODE_ENV=production

      # Shared secret required on /register, /unregister, /heartbeat (REQUIRED in production)
      - DISCORD_BROKER_SECRET=${DISCORD_BROKER_SECRET:-}
      # Rollout only: "true" lets pre-secret backends keep registering; remove afterwards
      - BROKER_ALLOW_UNAUTHENTICATED_CONTROL=${BROKER_ALLOW_UNAUTHENTICATED_CONTROL:-}
      # Optional: comma-separated hosts a registered callback endpoint may use
      - BROKER_ALLOWED_ENDPOINT_HOSTS=${BROKER_ALLOWED_ENDPOINT_HOSTS:-}

    ports:
      - "3000:3000"  # Change the first port if 3000 is already in use

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    # Security settings
    security_opt:
      - no-new-privileges:true

    # Run as non-root user
    user: "1001:1001"

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - discord-net

networks:
  discord-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16